<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Layout-Spielwiese</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Werkbank – links Regler + Bühne, rechts der erzeugte Code; ein Thema pro Tab, je eine Beamer-Seite */
:root {
  --bg: #f6f7fc;
  --fg: #1f1f1f;
  --muted: #4a4e6c;
  --line: #d3d6ec;
  --line-strong: #a9aed3;
  --card: #ffffff;
  --surface: #eef0fb;
  --surface-2: #dcdff2;
  --blue: #0000ff;
  --blue-ink: #0000d6;
  --fill: #0000ff;
  --purple: #612ff8;
  --purple-ink: #4a1fd0;
  --on-accent: #ffffff;
  --focus: #612ff8;
  --stage-bg: #ffffff;
  --stage-dot: #e2e4f3;
  --dash: #7a80ff;
  --code-bg: #ffffff;
  --code-fg: #1f1f1f;
  --c-sel: #4a1fd0;
  --c-prop: #0000c2;
  --c-num: #a0005f;
  --c-str: #04664a;
  --c-com: #5f6385;
  --c-at: #a0005f;
  --c-var: #00609e;
  --flash-strong: rgba(97, 47, 248, .30);
  --flash-weak: rgba(97, 47, 248, .09);
  --active: rgba(0, 0, 255, .08);
  --use: rgba(0, 0, 255, .06);
  --ok: #0b6b3a;
  --warn: #b0201a;
  --warn-bg: #fdecea;
  --k1-bg: #0000ff; --k1-fg: #ffffff;
  --k2-bg: #612ff8; --k2-fg: #ffffff;
  --k3-bg: #dcdff2; --k3-fg: #1f1f1f;
  --k4-bg: #1f1f1f; --k4-fg: #ffffff;
  --k5-bg: #c9ccff; --k5-fg: #00009c;
  --k6-bg: #e4dbff; --k6-fg: #3a12b8;
  --phone: #1f1f1f;
  --font-sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1020; --fg: #eceeff; --muted: #a9addb; --line: #2c2f52; --line-strong: #4a4f86;
    --card: #1b1d33; --surface: #1b1d33; --surface-2: #26294a;
    --blue: #7a82ff; --blue-ink: #9aa0ff; --fill: #3d47f5; --purple: #9b7bff; --purple-ink: #b9a3ff;
    --on-accent: #ffffff; --focus: #b9a3ff;
    --stage-bg: #14162a; --stage-dot: #23264a; --dash: #6b74ff;
    --code-bg: #12142a; --code-fg: #e9eaff;
    --c-sel: #c2b0ff; --c-prop: #9aa2ff; --c-num: #ff9fd0; --c-str: #86e3bf; --c-com: #9a9fc9; --c-at: #ff9fd0; --c-var: #8fd3ff;
    --flash-strong: rgba(155, 123, 255, .38); --flash-weak: rgba(155, 123, 255, .12);
    --active: rgba(122, 130, 255, .14); --use: rgba(122, 130, 255, .10);
    --ok: #6fdc9c; --warn: #ff8a80; --warn-bg: #3a1a22;
    --k1-bg: #3d47f5; --k1-fg: #ffffff;
    --k2-bg: #7a4dff; --k2-fg: #ffffff;
    --k3-bg: #2c2f52; --k3-fg: #eceeff;
    --k4-bg: #eceeff; --k4-fg: #12142a;
    --k5-bg: #c9ccff; --k5-fg: #00009c;
    --k6-bg: #e4dbff; --k6-fg: #3a12b8;
    --phone: #050611;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1020; --fg: #eceeff; --muted: #a9addb; --line: #2c2f52; --line-strong: #4a4f86;
  --card: #1b1d33; --surface: #1b1d33; --surface-2: #26294a;
  --blue: #7a82ff; --blue-ink: #9aa0ff; --fill: #3d47f5; --purple: #9b7bff; --purple-ink: #b9a3ff;
  --on-accent: #ffffff; --focus: #b9a3ff;
  --stage-bg: #14162a; --stage-dot: #23264a; --dash: #6b74ff;
  --code-bg: #12142a; --code-fg: #e9eaff;
  --c-sel: #c2b0ff; --c-prop: #9aa2ff; --c-num: #ff9fd0; --c-str: #86e3bf; --c-com: #9a9fc9; --c-at: #ff9fd0; --c-var: #8fd3ff;
  --flash-strong: rgba(155, 123, 255, .38); --flash-weak: rgba(155, 123, 255, .12);
  --active: rgba(122, 130, 255, .14); --use: rgba(122, 130, 255, .10);
  --ok: #6fdc9c; --warn: #ff8a80; --warn-bg: #3a1a22;
  --k1-bg: #3d47f5; --k1-fg: #ffffff;
  --k2-bg: #7a4dff; --k2-fg: #ffffff;
  --k3-bg: #2c2f52; --k3-fg: #eceeff;
  --k4-bg: #eceeff; --k4-fg: #12142a;
  --k5-bg: #c9ccff; --k5-fg: #00009c;
  --k6-bg: #e4dbff; --k6-fg: #3a12b8;
  --phone: #050611;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 18px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page {
  max-width: 1600px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 16px;
}

/* ---------- Kopf & Tabs ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; min-width: 0; }
.brand h1 { margin: 0; font-size: 23px; line-height: 1.2; letter-spacing: -.01em; font-weight: 700; }
.brand h1 .mark { color: var(--blue); }
.brand .sub { color: var(--muted); font-size: 15px; }
.top-tools { display: flex; gap: 8px; align-items: center; }
.btn {
  min-height: 36px; padding: 4px 12px; border-radius: 5px; cursor: pointer;
  border: 1.5px solid var(--line-strong); background: var(--card); color: var(--fg); font-size: 15px;
}
.btn:hover { border-color: var(--blue); }
.btn.small { min-height: 30px; font-size: 14px; padding: 2px 10px; }

.tabs {
  display: flex; gap: 2px; margin-top: 6px;
  overflow-x: auto; scrollbar-width: thin;
  border-bottom: 2px solid var(--line);
}
.tab {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  font-size: 16.5px; font-weight: 600; color: var(--muted);
  padding: 8px 13px 7px; margin-bottom: -2px;
  border-bottom: 3px solid transparent; white-space: nowrap;
  display: flex; align-items: baseline; gap: 7px;
}
.tab .nr { font-family: var(--font-mono); font-size: 13px; font-weight: 400; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--blue); }
.tab[aria-selected="true"] .nr { color: var(--blue); }

/* ---------- Tab-Inhalt ---------- */
.panel { padding-top: 12px; }
.parts { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 10px; }
.parts .lbl { font-size: 15px; color: var(--muted); }
.work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px 22px; }
@media (min-width: 980px) {
  .work { grid-template-columns: minmax(0, 1.42fr) minmax(0, 1fr); }
}
.left { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.right { min-width: 0; display: flex; flex-direction: column; gap: 12px; }

/* Regler */
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ctl-l { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, .tgl {
  min-height: 36px; padding: 3px 11px; border-radius: 5px; cursor: pointer;
  border: 1.5px solid var(--line-strong); background: var(--card); color: var(--fg);
  font-size: 15.5px; line-height: 1.25;
}
.seg button.mono { font-family: var(--font-mono); font-size: 15px; }
.seg button:hover, .tgl:hover { border-color: var(--blue); }
.seg button[aria-pressed="true"] { background: var(--fill); border-color: var(--fill); color: var(--on-accent); }
.tgl { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 15px; }
.tgl::before {
  content: ""; width: 16px; height: 16px; border-radius: 3px; flex: none;
  border: 2px solid var(--line-strong); background: var(--card);
}
.tgl[aria-pressed="true"] { border-color: var(--fill); }
.tgl[aria-pressed="true"]::before {
  background: var(--fill); border-color: var(--fill);
  box-shadow: inset 0 0 0 2px var(--card);
}
.ctl-range input[type="range"] { width: min(220px, 70vw); accent-color: var(--fill); height: 28px; margin: 0; }
.ctl-range output { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.presets .ctl-l { margin-right: 4px; }

/* Bühne */
.stage {
  position: relative; min-width: 0;
  background-color: var(--stage-bg);
  background-image: radial-gradient(var(--stage-dot) 1.2px, transparent 1.4px);
  background-size: 18px 18px;
  border: 1.5px solid var(--line); border-radius: 8px;
  padding: 16px; overflow-x: auto;
}
.stage-note { font-size: 15.5px; color: var(--muted); margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.stage-note strong { color: var(--fg); }
.warn { color: var(--warn); font-weight: 600; }
.okay { color: var(--ok); font-weight: 600; }

.explain { background: var(--surface); border-radius: 8px; padding: 10px 16px 12px; font-size: 17px; line-height: 1.5; }
.explain h3 { margin: 0 0 2px; font-size: 14px; font-family: var(--font-mono); font-weight: 600; color: var(--purple-ink); }
.explain p { margin: 0; max-width: 75ch; }
.explain p + p { margin-top: 6px; }
.explain code, .stage-note code, .ctl-note code { font-size: .92em; }
.hint { border-left: 0; font-size: 16px; color: var(--fg); background: var(--surface-2); padding: 8px 14px; border-radius: 6px; margin: 0; }

/* Code-Panel */
.codebox { background: var(--code-bg); border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
@media (min-width: 980px) {
  .codebox { position: sticky; top: 10px; display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
  .code-body { overflow: auto; min-height: 0; }
}
.code-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 5px 8px 5px 14px; border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 14px; color: var(--muted);
}
.code-sec { font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding: 10px 16px 0; letter-spacing: .02em; }
.code-sec + pre { padding-top: 4px; }
pre.code {
  margin: 0; padding: 10px 0 12px; overflow-x: auto;
  font-family: var(--font-mono); font-size: 16.5px; line-height: 1.5; color: var(--code-fg); tab-size: 2;
}
pre.code > code { display: inline-block; min-width: 100%; font-size: inherit; }
.ln { display: block; padding: 0 16px; white-space: pre; min-height: 1.5em; }
.ln.chg { box-shadow: inset 4px 0 0 var(--purple); animation: flash 2.4s ease-out both; }
.ln.act { background: var(--active); box-shadow: inset 4px 0 0 var(--blue); }
.ln.dim { opacity: .5; }
.ln.use { background: var(--use); box-shadow: inset 4px 0 0 var(--blue); }
.ln.chg.act, .ln.chg.use { animation-name: flash; }
@keyframes flash { 0% { background: var(--flash-strong); } 100% { background: var(--flash-weak); } }
.code .s { color: var(--c-sel); font-weight: 600; }
.code .p { color: var(--c-prop); }
.code .n { color: var(--c-num); }
.code .str { color: var(--c-str); }
.code .c { color: var(--c-com); font-style: italic; }
.code .at { color: var(--c-at); font-weight: 600; }
.code .var { color: var(--c-var); }
.code .fn { color: var(--c-sel); }
.code .t { color: var(--c-sel); }
.code .a { color: var(--c-prop); }

.foot {
  margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px;
  font-size: 14.5px; color: var(--muted);
}
kbd { font-family: var(--font-mono); font-size: 13px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); color: var(--fg); }

/* ---------- Demo-Basisstile (Farben, Schrift). Layout kommt aus dem gezeigten Code. ---------- */
.k1 { background: var(--k1-bg); color: var(--k1-fg); }
.k2 { background: var(--k2-bg); color: var(--k2-fg); }
.k3 { background: var(--k3-bg); color: var(--k3-fg); }
.k4 { background: var(--k4-bg); color: var(--k4-fg); }
.k5 { background: var(--k5-bg); color: var(--k5-fg); }
.k6 { background: var(--k6-bg); color: var(--k6-fg); }

/* Tab 1 */
.fg-axes { position: relative; padding: 34px 0 0 32px; min-width: 320px; }
.fg-c { border: 2px dashed var(--dash); background: var(--stage-bg); }
.fg-i { padding: .3em .5em; font-weight: 600; border-radius: 4px; font-size: 15px; line-height: 1.3; }
.fg-i.fg-logo { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.ax { position: absolute; color: var(--blue-ink); font-family: var(--font-mono); font-size: 13.5px; pointer-events: none; }
.ax.cross { color: var(--purple-ink); }
.ax-x { top: 4px; left: 32px; right: 0; height: 24px; display: flex; align-items: flex-start; }
.ax-x::before { content: ""; position: absolute; left: 0; right: 10px; bottom: 2px; height: 2px; background: currentColor; }
.ax-x::after { content: ""; position: absolute; right: 0; bottom: -3px; border: 6px solid transparent; border-left: 10px solid currentColor; border-right: 0; }
.ax-y { top: 34px; left: 4px; bottom: 0; width: 26px; display: flex; justify-content: flex-start; }
.ax-y::before { content: ""; position: absolute; top: 0; bottom: 10px; right: 2px; width: 2px; background: currentColor; }
.ax-y::after { content: ""; position: absolute; bottom: 0; right: -3px; border: 6px solid transparent; border-top: 10px solid currentColor; border-bottom: 0; }
.ax-y span { writing-mode: vertical-rl; white-space: nowrap; }
.ax span { background: var(--stage-bg); padding: 0 4px; position: relative; }

/* Tab 2 */
.f1-nav { background: var(--card); border: 2px dashed var(--dash); padding: 10px; }
.f1-it { border-radius: 5px; min-height: 44px; display: flex; align-items: center; padding: 0 12px; font-weight: 600; white-space: nowrap; }
.f1-logo { gap: 8px; }
.f1-logo svg { flex: none; }
.f1-suche { padding: 0; background: transparent; }
.f1-suche input {
  width: 100%; min-width: 0; height: 44px; padding: 0 12px; border-radius: 5px;
  border: 2px solid var(--line-strong); background: var(--stage-bg); font-size: 16px;
}
.f1-mess { position: relative; height: 46px; margin-top: 6px; }
.f1-mess div {
  position: absolute; top: 0; text-align: center; font-family: var(--font-mono); font-size: 14px;
  border-top: 2px solid var(--purple); padding-top: 3px; color: var(--purple-ink); white-space: nowrap; overflow: visible;
  font-variant-numeric: tabular-nums; line-height: 1.25;
}
.f1-mess div span { display: block; color: var(--muted); font-size: 12.5px; }
.ftab-wrap { overflow-x: auto; max-width: 100%; }
.ftab { border-collapse: collapse; }
.ftab th { font-family: var(--font-mono); font-size: 14px; font-weight: 400; color: var(--muted); text-align: left; padding: 0 14px 2px 0; }
.ftab td { padding: 2px 14px 2px 0; vertical-align: middle; }
.ftab td:first-child { font-weight: 600; font-family: var(--font-mono); font-size: 15px; white-space: nowrap; }
.ftab .seg button { min-height: 34px; padding: 2px 9px; }

.f1b-karte { background: var(--card); border: 2px dashed var(--dash); border-radius: 8px; padding: 12px; }
.f1b-avatar { border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
.f1b-titel { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.35; }
.f1b-sub { margin: 2px 0 0; font-size: 15px; color: var(--muted); }

/* Tab 3 */
.z-wrap { position: relative; }
.z-box { border: 2px dashed var(--dash); background: var(--stage-bg); }
.z-kind { padding: 10px 16px; font-weight: 700; border-radius: 5px; font-size: 18px; }
.z-ov { position: absolute; inset: 2px; pointer-events: none; }
.z-cell { position: absolute; border: 2px dashed var(--purple); border-radius: 2px; }
.z-cell span { position: absolute; top: 0; left: 0; font-family: var(--font-mono); font-size: 12px; color: var(--purple-ink); background: var(--stage-bg); padding: 0 4px; line-height: 1.4; }
.z-legend { display: grid; gap: 4px; font-size: 16px; }
.z-legend div { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; }
.z-legend code { color: var(--blue-ink); font-weight: 600; }

/* Tab 4 */
.g-raster { background: var(--stage-bg); outline: 2px dashed var(--dash); outline-offset: 0; }
.g-col { min-height: 110px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 22px; font-weight: 600; border-radius: 4px; }
.g-ruler { display: grid; margin-bottom: 8px; }
.g-ruler div { text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--purple-ink); border-bottom: 2px solid var(--purple); padding-bottom: 2px; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-ruler div b { display: block; color: var(--fg); font-size: 15px; }
.g-math { font-family: var(--font-mono); font-size: 15.5px; margin: 10px 0 0; line-height: 1.6; color: var(--fg); font-variant-numeric: tabular-nums; }
.g-math .res { color: var(--blue-ink); font-weight: 600; }
.ga-seite { border: 2px dashed var(--dash); padding: 0; min-width: 300px; }
.ga-seite > * { border-radius: 5px; padding: 8px 12px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-width: 0; font-family: var(--font-mono); }
.ga-seite b { font-size: 18px; }
.ga-seite small { font-size: 12.5px; opacity: .85; }

/* Tab 5 */
.r-devices { display: flex; flex-wrap: wrap; gap: 6px; }
.r-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.r-chip { font-family: var(--font-mono); font-size: 14px; padding: 3px 10px; border-radius: 999px; border: 1.5px solid var(--line-strong); color: var(--muted); }
.r-chip.on { border-color: var(--fill); background: var(--fill); color: var(--on-accent); }
.r-outer { overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1.5px var(--line-strong); background: #ffffff; }
.r-inner { transform-origin: 0 0; }
.r-inner iframe, .tw-inner iframe { display: block; border: 0; background: #ffffff; }
.cq-wrap { display: flex; gap: 14px; align-items: flex-start; min-width: 520px; }
.cq-col { border: 2px dashed var(--dash); padding: 12px; border-radius: 6px; background: var(--stage-bg); }
.cq-side { flex: none; }
.cq-main { flex: 1; min-width: 0; }
.cq-lab { font-family: var(--font-mono); font-size: 13.5px; color: var(--muted); margin: 0 0 8px; font-variant-numeric: tabular-nums; }
.cq-lab b { color: var(--fg); }
.cq-karte { background: var(--card); border: 1.5px solid var(--line); border-radius: 6px; padding: 10px; }
.cq-bild { background: var(--k5-bg); border-radius: 4px; min-height: 88px; display: grid; place-items: center; }
.cq-bild svg { width: 110px; height: auto; }
.cq-karte h4 { margin: 0; font-size: 18px; }
.cq-karte p { margin: 2px 0 0; font-size: 15px; color: var(--muted); }

/* Tab 6 */
.dv-phones { display: flex; flex-wrap: wrap; gap: 18px 34px; justify-content: center; }
.dv-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dv-col h4 { margin: 0; font-family: var(--font-mono); font-size: 17px; color: var(--blue-ink); }
.phone { width: 252px; padding: 10px; border-radius: 34px; background: var(--phone); box-shadow: 0 0 0 1.5px var(--line-strong); }

<script>
(function () {
'use strict';

/* ================= Hilfsfunktionen ================= */
function h(tag, attrs) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (let i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, kid) {
  if (kid == null || kid === false) return;
  if (Array.isArray(kid)) { kid.forEach(k => add(el, k)); return; }
  el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const span = (c, s) => '<span class="' + c + '">' + esc(s) + '</span>';
const fmt = (n, d) => Number(n).toLocaleString('de-DE', { maximumFractionDigits: d || 0, minimumFractionDigits: 0 });
const slug = v => String(v).replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'x';
const px = n => Math.round(n) + ' px';

function styleTag(id) {
  const s = document.createElement('style');
  s.id = id;
  document.head.appendChild(s);
  return s;
}

/* ---------- Bedienelemente ---------- */
function seg(id, label, opts, get, set, o) {
  o = o || {};
  const lid = id + '-l';
  const wrap = h('div', { class: 'ctl', role: 'group', 'aria-labelledby': label ? lid : null, 'aria-label': label ? null : (o.aria || id) });
  if (label) wrap.append(h('span', { class: 'ctl-l', id: lid }, label));
  const row = h('div', { class: 'seg' });
  const btns = opts.map(op => {
    const v = Array.isArray(op) ? op[0] : op, t = Array.isArray(op) ? op[1] : op;
    const b = h('button', { type: 'button', id: id + '-' + slug(v), class: o.plain ? '' : 'mono', 'aria-pressed': 'false', onclick: () => set(v) }, t);
    b._v = v; row.append(b); return b;
  });
  wrap.append(row);
  wrap.sync = () => btns.forEach(b => b.setAttribute('aria-pressed', String(b._v === get())));
  return wrap;
}
function range(id, label, min, max, step, get, set, unit) {
  unit = unit == null ? ' px' : unit;
  const out = h('output', { id: id + '-o', for: id });
  const inp = h('input', { type: 'range', id: id, min: min, max: max, step: step, value: get(), oninput: e => set(+e.target.value) });
  const wrap = h('div', { class: 'ctl ctl-range' }, h('label', { class: 'ctl-l', for: id }, label + ' ', out), inp);
  wrap.sync = () => { if (+inp.value !== get()) inp.value = get(); out.textContent = get() + unit; };
  return wrap;
}
function toggle(id, label, get, set) {
  const b = h('button', { type: 'button', class: 'tgl', id: id, 'aria-pressed': 'false', onclick: () => set(!get()) }, label);
  b.sync = () => b.setAttribute('aria-pressed', String(!!get()));
  return b;
}

/* ---------- CSS-Modell → Text + angewendetes CSS ---------- */
/* item: {sel, decls:[[prop, value, {off, note}] | {c}] , inline} | {at, rules, tag} | {c: 'x' | ['a','b']} | {blank:true} */
function cssLines(items, ind, tag, out) {
  ind = ind || ''; out = out || [];
  for (const it of items) {
    const tg = it.tag || tag || null;
    if (it.blank) { out.push({ t: '', tag: tg }); continue; }
    if (it.c != null) { pushComment(out, it.c, ind, tg); continue; }
    if (it.at) {
      out.push({ t: ind + it.at + ' {', tag: tg });
      cssLines(it.rules, ind + '  ', tg, out);
      out.push({ t: ind + '}', tag: tg });
      continue;
    }
    if (it.inline && it.decls.length === 1 && Array.isArray(it.decls[0]) && !(it.decls[0][2] || {}).note) {
      out.push({ t: ind + it.sel + ' { ' + declText(it.decls[0]) + ' }', tag: tg });
      continue;
    }
    out.push({ t: ind + it.sel + ' {', tag: tg });
    for (const d of it.decls) {
      if (!Array.isArray(d)) { pushComment(out, d.c, ind + '  ', tg); continue; }
      const v = d[1];
      if (Array.isArray(v)) {
        out.push({ t: ind + '  ' + d[0] + ':', tag: tg });
        v.forEach((x, i) => out.push({ t: ind + '    ' + x + (i === v.length - 1 ? ';' : ''), tag: tg }));
      } else out.push({ t: ind + '  ' + declText(d), tag: tg });
    }
    out.push({ t: ind + '}', tag: tg });
  }
  return out;
}
function declText(d) {
  const o = d[2] || {};
  let s = d[0] + ': ' + d[1] + ';';
  if (o.off) s = '/* ' + s + ' */';
  if (o.note) s += ' /* ' + o.note + ' */';
  return s;
}
function pushComment(out, c, ind, tg) {
  const arr = [].concat(c);
  if (arr.length === 1) out.push({ t: ind + '/* ' + arr[0] + ' */', tag: tg });
  else {
    out.push({ t: ind + '/*', tag: tg });
    arr.forEach(l => out.push({ t: ind + '   ' + l, tag: tg }));
    out.push({ t: ind + '*/', tag: tg });
  }
}
function cssApplied(items, scope) {
  let s = '';
  for (const it of items) {
    if (it.blank || it.c != null) continue;
    if (it.at) { s += it.at + ' {\n' + cssApplied(it.rules, scope) + '}\n'; continue; }
    const sel = scope ? it.sel.split(',').map(x => { x = x.trim(); return x === ':root' ? scope : scope + ' ' + x; }).join(', ') : it.sel.trim();
    const decls = it.decls.filter(d => Array.isArray(d) && !(d[2] && d[2].off))
      .map(d => d[0] + ': ' + (Array.isArray(d[1]) ? d[1].join(' ') : d[1]));
    s += sel + ' { ' + decls.join('; ') + (decls.length ? ';' : '') + ' }\n';
  }
  return s;
}
const textOf = lines => lines.map(l => l.t).join('\n');

/* ---------- Syntax-Färbung ---------- */
const VAL_RE = /\b(var|calc|repeat|minmax|oklch|rgb|rgba|hsl|scale)(?=\()|(--[\w-]+)|(#[0-9a-fA-F]{3,8}\b)|("[^"]*"|'[^']*')|((?<![\w-])-?\d*\.?\d+(?:px|rem|em|fr|%|vh|dvh|svh|lvh|vw|ms|s|deg)?(?![\w-]))/g;
function hlVal(s) {
  let out = '', i = 0, m;
  VAL_RE.lastIndex = 0;
  while ((m = VAL_RE.exec(s))) {
    out += esc(s.slice(i, m.index));
    const cls = m[1] ? 'fn' : m[2] ? 'var' : m[3] ? 'n' : m[4] ? 'str' : 'n';
    out += span(cls, m[0]);
    i = m.index + m[0].length;
    if (m[0].length === 0) VAL_RE.lastIndex++;
  }
  return out + esc(s.slice(i));
}
function hlDecls(s) {
  const parts = s.match(/[^;]+;?|;/g) || [];
  return parts.map(p => {
    const m = p.match(/^(\s*)(--?[a-zA-Z][\w-]*)(\s*:\s*)(.*?)(;?)(\s*)$/);
    if (m) return esc(m[1]) + span(m[2].slice(0, 2) === '--' ? 'var' : 'p', m[2]) + esc(m[3]) + hlVal(m[4]) + esc(m[5]) + esc(m[6]);
    const m2 = p.match(/^(\s*)([a-zA-Z-]+)(:)\s*$/);
    if (m2) return esc(m2[1]) + span('p', m2[2]) + esc(m2[3]);
    return hlVal(p);
  }).join('');
}
function hlCSSCode(s) {
  if (!s.trim()) return esc(s);
  let m = s.match(/^(\s*)(@[\w-]+)(.*)$/);
  if (m) return esc(m[1]) + span('at', m[2]) + hlVal(m[3]);
  const t = s.trim();
  if (t === '}' || t === '{') return esc(s);
  m = s.match(/^(\s*)([^{}]+?)(\s*\{\s*)(.*?)(\s*\}\s*)$/);
  if (m) return esc(m[1]) + span('s', m[2]) + esc(m[3]) + hlDecls(m[4]) + esc(m[5]);
  m = s.match(/^(\s*)([^{}]+?)(\s*\{\s*)$/);
  if (m) return esc(m[1]) + span('s', m[2]) + esc(m[3]);
  return hlDecls(s);
}
function hlCSS(line, st) {
  let out = '', i = 0;
  while (i < line.length) {
    if (st.inC) {
      const e = line.indexOf('*/', i);
      if (e < 0) { out += span('c', line.slice(i)); return out; }
      out += span('c', line.slice(i, e + 2)); i = e + 2; st.inC = false; continue;
    }
    const s = line.indexOf('/*', i);
    if (s < 0) { out += hlCSSCode(line.slice(i)); break; }
    out += hlCSSCode(line.slice(i, s));
    i = s; st.inC = true;
    const e = line.indexOf('*/', s + 2);
    if (e < 0) { out += span('c', line.slice(s)); return out; }
    out += span('c', line.slice(s, e + 2)); i = e + 2; st.inC = false;
  }
  return out;
}
function hlHTML(s) {
  const re = /<\/?[a-zA-Z][\w-]*|\s[\w:.-]+(?==")|="[^"]*"|\/?>/g;
  let out = '', i = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(i, m.index));
    const t = m[0];
    if (t[0] === '=') out += '=' + span('str', t.slice(1));
    else if (/^\s/.test(t)) out += esc(t[0]) + span('a', t.slice(1));
    else out += span('t', t);
    i = re.lastIndex;
  }
  return out + esc(s.slice(i));
}

/* ---------- Code-Panel ---------- */
function CodePanel(id, title) {
  const body = h('div', { class: 'code-body' });
  const copyBtn = h('button', { type: 'button', class: 'btn small', id: id + '-copy' }, 'Kopieren');
  const el = h('div', { class: 'codebox', id: id },
    h('div', { class: 'code-head' }, h('span', null, title), copyBtn), body);
  let prev = null, lastSig = '', lastText = '';
  copyBtn.addEventListener('click', () => {
    const done = ok => { copyBtn.textContent = ok ? 'Kopiert' : 'Markiert – Strg+C'; setTimeout(() => { copyBtn.textContent = 'Kopieren'; }, 1600); };
    const selectAll = () => { try { const r = document.createRange(); r.selectNodeContents(body); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (e) {} done(false); };
    try { navigator.clipboard.writeText(lastText).then(() => done(true), selectAll); } catch (e) { selectAll(); }
  });
  function set(sections, opt) {
    opt = opt || {};
    const sig = JSON.stringify([sections.map(s => [s.label, s.lang, s.lines.map(l => [l.t, l.tag])]), opt.active ? [...opt.active] : 0, opt.dim ? [...opt.dim] : 0, opt.uses || '']);
    if (sig === lastSig) return;
    lastSig = sig;
    const next = {};
    let html = '';
    lastText = sections.map(s => textOf(s.lines)).join('\n\n');
    for (const sec of sections) {
      const key = sec.label || '_';
      const before = prev && prev[key];
      const counts = {};
      if (before) before.forEach(t => { counts[t] = (counts[t] || 0) + 1; });
      next[key] = sec.lines.map(l => l.t);
      if (sec.label) html += '<div class="code-sec">' + esc(sec.label) + '</div>';
      html += '<pre class="code" tabindex="0" aria-label="' + esc(sec.label || title) + '"><code>';
      const st = { inC: false };
      for (const l of sec.lines) {
        const cls = ['ln'];
        if (before) {
          if (counts[l.t] > 0) counts[l.t]--; else if (l.t.trim() && l.t.trim() !== '}') cls.push('chg');
        }
        if (opt.active && l.tag && opt.active.has(l.tag)) cls.push('act');
        if (opt.dim && l.tag && opt.dim.has(l.tag)) cls.push('dim');
        if (opt.uses && l.t.indexOf(opt.uses) >= 0 && l.t.indexOf('var(') >= 0) cls.push('use');
        const inner = sec.lang === 'html' ? hlHTML(l.t) : hlCSS(l.t, st);
        html += '<span class="' + cls.join(' ') + '">' + (inner || '') + '</span>';
      }
      html += '</code></pre>';
    }
    prev = next;
    body.innerHTML = html;
  }
  return { el: el, set: set, reset: () => { prev = null; lastSig = ''; } };
}

/* ---------- Iframe-Helfer ---------- */
const FRAME_LISTENER =
  "addEventListener('message',function(e){if(e.source!==parent)return;var d=e.data||{};" +
  "if(d.css!=null){var s=document.getElementById('live');if(s)s.textContent=d.css;}" +
  "if(d.rootAttr){for(var k in d.rootAttr){document.documentElement.setAttribute(k,d.rootAttr[k]);}}" +
  "if(d.cls!=null&&d.id){var el=document.getElementById(d.id);if(el)el.className=d.cls;}});";
function frameDoc(head, body, script) {
  return '<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
    head + '</head><body>' + body + '<script>' + FRAME_LISTENER + (script || '') + '<\/script></body></html>';
}

/* ---------- Bausteine einer Tab-Seite ---------- */
function explain(html) { return h('div', { class: 'explain' }, h('h3', null, 'Was passiert hier?'), h('div', { html: html })); }
function work(left, right) { return h('div', { class: 'work' }, h('div', { class: 'left' }, left), h('div', { class: 'right' }, right)); }
function syncAll(list) { list.forEach(c => c && c.sync && c.sync()); }

/* ======================================================================
   Tab 1: Flex oder Grid
   ====================================================================== */
function tabFlexGrid(sec) {
  const S = { display: 'flex', dir: 'row', wrap: 'nowrap', jc: 'flex-start', ai: 'stretch', gap: 8,
    gtc: '1fr 1fr 1fr', ji: 'stretch', gai: 'stretch' };
  const set = k => v => { S[k] = v; update(); };
  const cDisplay = seg('fg-display', 'display', ['block', 'flex', 'grid'], () => S.display, set('display'));
  const cDir = seg('fg-dir', 'flex-direction', ['row', 'column'], () => S.dir, set('dir'));
  const cWrap = seg('fg-wrap', 'flex-wrap', ['nowrap', 'wrap'], () => S.wrap, set('wrap'));
  const cJc = seg('fg-jc', 'justify-content', ['flex-start', 'center', 'flex-end', 'space-between', 'space-around', 'space-evenly'], () => S.jc, set('jc'));
  const cAi = seg('fg-ai', 'align-items', ['stretch', 'flex-start', 'center', 'flex-end', 'baseline'], () => S.ai, set('ai'));
  const cGtc = seg('fg-gtc', 'grid-template-columns', ['1fr 1fr 1fr', '200px 1fr', '1fr 2fr', 'repeat(4, 1fr)', 'repeat(auto-fit, minmax(150px, 1fr))'], () => S.gtc, set('gtc'));
  const cJi = seg('fg-ji', 'justify-items', ['stretch', 'start', 'center', 'end'], () => S.ji, set('ji'));
  const cGai = seg('fg-gai', 'align-items', ['stretch', 'start', 'center', 'end'], () => S.gai, set('gai'));
  const cGap = range('fg-gap', 'gap', 0, 40, 1, () => S.gap, set('gap'));
  const ctls = [cDisplay, cDir, cWrap, cJc, cAi, cGtc, cJi, cGai, cGap];
  const flexOnly = [cDir, cWrap, cJc, cAi], gridOnly = [cGtc, cJi, cGai];

  const items = ['Logo', 'Start', 'Über uns', 'Ein längerer Menüpunkt', 'Kontakt', 'Login']
    .map((t, i) => h('div', { class: 'item fg-i k' + (i + 1) + (i === 0 ? ' fg-logo' : '') }, t));
  const cont = h('div', { class: 'container fg-c', id: 'fg-container' }, items);
  const axX = h('div', { class: 'ax ax-x', 'aria-hidden': 'true' }, h('span'));
  const axY = h('div', { class: 'ax ax-y', 'aria-hidden': 'true' }, h('span'));
  const stage = h('div', { class: 'stage', id: 'fg-stage' }, h('div', { class: 'fg-axes' }, axX, axY, cont));

  for (let rb = 0; rb <= R; rb++) for (let c = 0; c < C; c++) if (nm(rb - 1, c) !== nm(rb, c)) for (let x = c * cw + 1; x < c * cw + cw; x++) g[2 * rb][x] = '-';

    let c = 0;
    while (c < C) {

    }

  const ctls = [cColor, cR, cA, cT];
  const BASE = 'body{margin:0;padding:20px;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .2s,color .2s}' +
    '.wrap{display:grid;gap:18px;max-width:560px}.reihe{display:flex;flex-wrap:wrap;gap:12px}' +
    '.knopf{border:0;font:inherit;font-weight:700;cursor:pointer}.karte h3{margin:0 0 4px;font-size:19px}.karte p{margin:0 0 12px}';
  const BODY = '<div class="wrap"><div class="reihe"><button class="knopf" id="d-kaufen" type="button">Ticket kaufen</button><button class="knopf leise" id="d-merken" type="button">Merken</button><button class="knopf" id="d-teilen" type="button">Teilen</button></div>' +
    '<article class="karte"><h3>S1 → Bad Herrenalb</h3><p>Gleis 2 · in 4 min · barrierefrei</p><button class="knopf" id="d-details" type="button">Details</button></article></div>';
  function rules() {
    return [
      { sel: ':root', decls: [['--marke', S.marke], ['--radius', S.radius + 'px'], ['--abstand', S.abstand + 'px'], ['--flaeche', '#ffffff'], ['--text', '#1f1f1f']] },
      { sel: '[data-demo-theme="dunkel"]', decls: [['--flaeche', '#15172b'], ['--text', '#f1f2ff']] },
      { sel: 'body', decls: [['background', 'var(--flaeche)'], ['color', 'var(--text)']] },
      { sel: '.knopf', decls: [['background', 'var(--marke)'], ['color', '#ffffff'], ['border-radius', 'var(--radius)'], ['padding', 'calc(var(--abstand) / 2) var(--abstand)']] },
      { sel: '.knopf.leise', decls: [['background', 'transparent'], ['color', 'var(--text)'], ['border', '2px solid var(--marke)']] },
      { sel: '.karte', decls: [['border', '2px solid var(--marke)'], ['border-radius', 'var(--radius)'], ['padding', 'var(--abstand)']] },
      { sel: '.karte h3', decls: [{ c: '--titel gibt es nicht → Ersatzwert' }, ['color', 'var(--titel, var(--marke))']] }
    ];
  }
  const frame = h('iframe', { id: 'v-frame', title: 'Demo mit CSS-Variablen' });
  frame.srcdoc = frameDoc('<style>' + BASE + '</style><style id="live">' + cssApplied(rules(), null) + '</style>', BODY,
    "document.addEventListener('click',function(e){e.preventDefault();});");
  frame.addEventListener('load', () => post());
  const stage = h('div', { class: 'stage', id: 'v-stage' }, h('div', { class: 'v-outer' }, frame));
  const code = CodePanel('code-variablen', 'CSS · eine Quelle, viele Stellen');
  const exp = explain('<p>Namen mit <code>--</code> sind <strong>Custom Properties</strong> (CSS-Variablen). Man legt sie z. B. auf <code>:root</code> fest; sie <strong>erben</strong> wie <code>color</code> an alle Kinder. Gelesen werden sie mit <code>var(--name, Ersatzwert)</code> – der Ersatzwert gilt, wenn die Variable nicht gesetzt ist.</p><p>Ändere <code>--marke</code>: Eine Zeile im Code ändert sich, aber alle markierten Stellen färben sich mit. Für das dunkle Schema werden nur die Variablen neu belegt, die Regeln bleiben gleich. Die Demo läuft in einem eigenen Dokument, darum ist <code>:root</code> hier wirklich das <code>&lt;html&gt;</code>-Element.</p>');
  sec.append(work([h('div', { class: 'controls' }, cColor, cR, cA, cT), swatches, stage], [code.el, exp]));
  function post() {
    try { frame.contentWindow.postMessage({ css: cssApplied(rules(), null), rootAttr: { 'data-demo-theme': S.theme } }, '*'); } catch (e) {}
  }
  function update() {
    syncAll(ctls);
    post();
    code.set([
      { label: 'HTML', lang: 'html', lines: [{ t: '<html data-demo-theme="' + S.theme + '">' }] },
      { label: 'CSS', lang: 'css', lines: cssLines(rules()) }
    ], { uses: '--marke' });
  }
  return { update: update, onShow: update };
}

/* ======================================================================
   Tab 8: Tailwind vs. CSS
   ====================================================================== */
function tabTailwind(sec) {
  const DEFAULT_CLS = 'rounded-xl bg-slate-100 p-4 hover:bg-slate-200 md:p-6';
  const S = { cls: DEFAULT_CLS, w: 375, view: 'css', tw: 'laden' };
  const FH = 130;
  const HTML_CSS = [
    '<article class="karte">',
    '  <div class="kopf">',
    '    <h3 class="titel">S1 → Bad Herrenalb</h3>',
    '    <span class="badge">in 4 min</span>',
    '  </div>',
    '  <p class="info">Gleis 2, barrierefrei</p>',
    '</article>'];
  const CSS_RULES = [
    { sel: '.karte', decls: [['padding', '1rem'], ['border-radius', '0.75rem'], { c: 'slate-100' }, ['background-color', 'oklch(96.8% 0.007 247.896)']] },
    { sel: '.karte:hover', decls: [{ c: 'slate-200' }, ['background-color', 'oklch(92.9% 0.013 255.508)']] },
    { at: '@media (width >= 48rem)', rules: [{ sel: '.karte', decls: [['padding', '1.5rem']] }] },
    { sel: '.kopf', decls: [['display', 'flex'], ['align-items', 'center'], ['justify-content', 'space-between'], ['gap', '0.75rem']] },
    { sel: '.titel', decls: [['font-size', '1.125rem'], ['line-height', '1.75rem'], ['font-weight', '600']] },
    { sel: '.badge', decls: [['border-radius', '9999px'], { c: 'blue-700' }, ['background-color', 'oklch(48.8% 0.243 264.376)'], ['padding', '0.125rem 0.5rem'], ['font-size', '0.75rem'], ['line-height', '1rem'], ['font-weight', '600'], ['color', '#ffffff']] },
    { sel: '.info', decls: [['margin-top', '0.25rem'], ['font-size', '0.875rem'], ['line-height', '1.25rem'], { c: 'slate-600' }, ['color', 'oklch(44.6% 0.043 257.281)']] }
  ];
  const twHTML = cls => [
    '<article class="' + cls + '">',
    '  <div class="flex items-center justify-between gap-3">',
    '    <h3 class="text-lg font-semibold">S1 → Bad Herrenalb</h3>',
    '    <span class="rounded-full bg-blue-700 px-2 py-0.5',
    '                 text-xs font-semibold text-white">in 4 min</span>',
    '  </div>',
    '  <p class="mt-1 text-sm text-slate-600">Gleis 2, barrierefrei</p>',
    '</article>'];
  /* Gemeinsame Grundlage beider Rahmen: Tailwinds Preflight-Reset und Standardschrift */
  const RESET = '*,::before,::after{box-sizing:border-box;margin:0;padding:0;border:0 solid}' +
    'html{line-height:1.5;font-family:ui-sans-serif,system-ui,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";-webkit-text-size-adjust:100%}' +
    'h3{font-size:inherit;font-weight:inherit}';
  const FRAME_BODY = 'body{padding:16px;background:#ffffff;color:#000000}';
  const cssFrame = h('iframe', { id: 'tw-frame-css', title: 'Karte mit handgeschriebenem CSS', height: FH });
  cssFrame.srcdoc = frameDoc('<style>' + RESET + FRAME_BODY + '</style><style id="live">' + cssApplied(CSS_RULES, null) + '</style>', HTML_CSS.join('\n'));
  const twFrame = h('iframe', { id: 'tw-frame-tw', title: 'Karte mit Tailwind-Klassen', height: FH });
  const TW_SCRIPT =
    "var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11';" +
    "s.onerror=function(){parent.postMessage({tw:'fehler'},'*');};document.head.appendChild(s);" +
    "var t0=Date.now();(function poll(){var p=document.getElementById('probe');if(p&&getComputedStyle(p).display==='none'){parent.postMessage({tw:'ok'},'*');return;}if(Date.now()-t0<8000)setTimeout(poll,150);})();";
  twFrame.srcdoc = frameDoc('<style>' + FRAME_BODY + '#probe{position:absolute;left:-9999px}</style>',
    twHTML(DEFAULT_CLS).join('\n').replace('<article class=', '<article id="tw-card" class=') + '<div id="probe" class="hidden">.</div>', TW_SCRIPT);
  twFrame.addEventListener('load', () => postCls());
  const offline = h('div', { class: 'tw-offline', role: 'status', hidden: true }, 'Tailwind konnte nicht geladen werden (offline?). Das Skript kommt von cdn.jsdelivr.net – ohne Internet bleibt diese Karte ungestylt.');
  const mkCell = (title, sub, frame, extra) => {
    const inner = h('div', { class: 'tw-inner' }, frame);
    const outer = h('div', { class: 'tw-outer' }, inner, extra || null);
    return { el: h('div', { class: 'tw-cell' }, h('h4', null, h('span', null, title), sub), outer), inner: inner, outer: outer, frame: frame };
  };
  const cellCSS = mkCell('Handgeschriebenes CSS', 'HTML + CSS', cssFrame);
  const cellTW = mkCell('Tailwind', 'nur HTML · @tailwindcss/browser 4.1.11', twFrame, offline);
  const cW = seg('tw-w', 'Fensterbreite beider Rahmen', [[375, '375 px (Handy)'], [800, '800 px (ab md)']], () => S.w, v => { S.w = v; update(); }, { plain: true });
  const ta = h('textarea', { id: 'tw-klassen', spellcheck: 'false', rows: 2, oninput: e => { S.cls = e.target.value.replace(/\s+/g, ' ').trim(); update(); } });
  ta.value = S.cls;
  const replaceCls = (re, cls) => { const parts = S.cls.split(/\s+/).filter(c => c && !re.test(c)); parts.push(cls); S.cls = parts.join(' '); ta.value = S.cls; update(); };
  const tryBtns = [['p-8', /^(md:)?p-\d/], ['rounded-none', /^rounded(-|$)/], ['bg-blue-100', /^bg-/], ['shadow-lg', /^shadow/]].map(t =>
    h('button', { type: 'button', class: 'btn small', id: 'tw-try-' + slug(t[0]), onclick: () => replaceCls(t[1], t[0]) }, t[0]));
  const resetBtn = h('button', { type: 'button', class: 'btn small', id: 'tw-reset', onclick: () => { S.cls = DEFAULT_CLS; ta.value = S.cls; update(); } }, 'Zurücksetzen');
  const edit = h('div', { class: 'tw-edit' }, h('label', { for: 'tw-klassen' }, 'Klassen der äußeren Karte (Tailwind-Seite) – probier es aus:'), ta,
    h('div', { class: 'tw-try' }, 'Ausprobieren:', tryBtns, resetBtn));
  const counts = h('dl', { class: 'tw-count', 'aria-live': 'polite' });
  const table = h('div', { class: 'tw-table-wrap' }, h('table', { class: 'tw-table' },
    h('thead', null, h('tr', null, h('th', null, 'Klasse'), h('th', null, 'erzeugtes CSS'))),
    h('tbody', null, [
      ['p-4', 'padding: 1rem'], ['rounded-xl', 'border-radius: 0.75rem'], ['bg-slate-100', 'background-color: var(--color-slate-100)'],
      ['flex', 'display: flex'], ['justify-between', 'justify-content: space-between'], ['items-center', 'align-items: center'],
      ['md:p-6', '@media (width >= 48rem) { padding: 1.5rem }'], ['hover:bg-slate-200', '&:hover { @media (hover: hover) { background-color: var(--color-slate-200) } }']
    ].map(r => h('tr', null, h('td', null, r[0]), h('td', null, r[1]))))));
  const cView = seg('tw-view', 'Code anzeigen', [['css', 'Handgeschrieben'], ['tw', 'Tailwind']], () => S.view, v => { S.view = v; update(); }, { plain: true });
  const code = CodePanel('code-tailwind', 'Code');
  const stage = h('div', { class: 'stage', id: 'tw-stage' }, h('div', { class: 'tw-grid' }, cellCSS.el, cellTW.el));
  const exp = explain('<p>Beide Karten sehen gleich aus. Links stehen Klassennamen im HTML und die Regeln in einer CSS-Datei. Rechts beschreibt jede <strong>Utility-Klasse</strong> genau eine Eigenschaft; Tailwind erzeugt das passende CSS selbst. <code>md:</code> ist eine Media Query (ab 48rem = 768 px), <code>hover:</code> ein Zustand. Die Breite der Rahmen bestimmt, ob <code>md:p-6</code> greift.</p>');
  sec.append(work([h('div', { class: 'controls' }, cW), stage, edit], [h('div', { class: 'controls' }, cView), code.el, counts, table, exp]));

  function postCls() { try { twFrame.contentWindow.postMessage({ id: 'tw-card', cls: S.cls }, '*'); } catch (e) {} }
  function fit() {
    [cellCSS, cellTW].forEach(c => {
      const avail = c.el.clientWidth;
      if (avail <= 0) return;
      const s = Math.min(1, avail / S.w);
      c.frame.style.width = S.w + 'px';
      c.inner.style.width = S.w + 'px';
      c.inner.style.transform = 'scale(' + s + ')';
      c.outer.style.width = S.w * s + 'px';
      c.outer.style.height = FH * s + 'px';
    });
  }
  const stat = text => {
    const lines = text.split('\n').filter(l => l.trim()).length;
    const chars = text.split('\n').map(l => l.trim()).join('').length;
    return [lines, chars];
  };
  window.addEventListener('message', e => {
    if (e.source !== twFrame.contentWindow || !e.data || !e.data.tw) return;
    S.tw = e.data.tw;
    offline.hidden = S.tw === 'ok';
  });
  setTimeout(() => { if (S.tw !== 'ok') offline.hidden = false; }, 4000);

  function update() {
    syncAll([cW, cView]);
    postCls();
    const cssText = textOf(cssLines(CSS_RULES));
    const a = stat(HTML_CSS.join('\n')), b = stat(cssText), c = stat(twHTML(S.cls).join('\n'));
    counts.innerHTML = '';
    counts.append(h('dt', null, 'Handgeschrieben'), h('dd', null, a[0] + ' Zeilen HTML + ' + b[0] + ' Zeilen CSS · ' + fmt(a[1] + b[1]) + ' Zeichen'),
      h('dt', null, 'Tailwind'), h('dd', null, c[0] + ' Zeilen HTML · ' + fmt(c[1]) + ' Zeichen'),
      h('dd', { style: 'grid-column: 1 / -1; color: var(--muted); font-size: 14px' }, 'Gezählt ohne Einrückung und Leerzeilen.'));
    if (S.view === 'css') code.set([{ label: 'HTML', lang: 'html', lines: HTML_CSS.map(t => ({ t: t })) }, { label: 'CSS', lang: 'css', lines: cssLines(CSS_RULES) }]);
    else code.set([{ label: 'HTML (kein eigenes CSS)', lang: 'html', lines: twHTML(S.cls).map(t => ({ t: t })) }]);
    fit();
  }
  return { update: update, onShow: update, onResize: fit };
}

/* ======================================================================
   Tabs, Routing, Tastatur, Farbschema
   ====================================================================== */
const TABS = [
  { id: 'flexgrid', name: 'Flex oder Grid', build: tabFlexGrid },
  { id: 'flex1', name: 'flex: 1', build: tabFlex1 },
  { id: 'zentrieren', name: 'Zentrieren', build: tabZentrieren },
  { id: 'grid', name: 'fr & Areas', build: tabGrid },
  { id: 'responsive', name: 'Responsive', build: tabResponsive },
  { id: 'dvh', name: '100dvh', build: tabDvh },
  { id: 'variablen', name: 'Variablen', build: tabVariablen },
  { id: 'tailwind', name: 'Tailwind vs. CSS', build: tabTailwind }
];
const tabsEl = document.getElementById('tabs'), panelsEl = document.getElementById('panels');
let current = null;
TABS.forEach((t, i) => {
  t.btn = h('button', { type: 'button', class: 'tab', role: 'tab', id: 't-' + t.id, 'aria-controls': 'p-' + t.id, 'aria-selected': 'false', tabindex: '-1', onclick: () => show(t.id, false) },
    h('span', { class: 'nr' }, String(i + 1)), t.name);
  tabsEl.append(t.btn);
  t.sec = h('section', { class: 'panel', role: 'tabpanel', id: 'p-' + t.id, 'aria-labelledby': 't-' + t.id, hidden: true }, h('h2', { class: 'sr-only' }, t.name));
  panelsEl.append(t.sec);
  try { t.api = t.build(t.sec); } catch (err) { t.sec.append(h('p', { class: 'warn' }, 'Fehler in diesem Tab: ' + err.message)); console.error(err); }
});
function show(id, focus) {
  const t = TABS.find(x => x.id === id) || TABS[0];
  TABS.forEach(x => {
    const on = x === t;
    x.btn.setAttribute('aria-selected', String(on));
    x.btn.tabIndex = on ? 0 : -1;
    x.sec.hidden = !on;
  });
  current = t;
  if (focus) t.btn.focus();
  t.btn.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  try { if (location.hash !== '#' + t.id) history.replaceState(null, '', '#' + t.id); }
  catch (e) { try { location.hash = t.id; } catch (e2) {} }
  if (t.api && t.api.onShow) t.api.onShow();
}
function step(d) {
  const i = TABS.indexOf(current);
  show(TABS[(i + d + TABS.length) % TABS.length].id, document.activeElement && document.activeElement.classList.contains('tab'));
}
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const a = document.activeElement;
  if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
  e.preventDefault();
  step(e.key === 'ArrowRight' ? 1 : -1);
});
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (current && id && id !== current.id && TABS.some(t => t.id === id)) show(id, false);
});
let rz = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(rz);
  rz = requestAnimationFrame(() => { if (current && current.api && current.api.onResize) current.api.onResize(); });
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current && current.api && current.api.onResize) current.api.onResize(); });

/* Farbschema: System → Hell → Dunkel */
const themeBtn = document.getElementById('theme-btn');
const MODES = [['system', 'Schema: System'], ['light', 'Schema: Hell'], ['dark', 'Schema: Dunkel']];
let mode = 0;
const curAttr = document.documentElement.getAttribute('data-theme');
if (curAttr === 'light') mode = 1; else if (curAttr === 'dark') mode = 2;
function applyMode() {
  const m = MODES[mode][0];
  if (m === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', m);
  themeBtn.textContent = MODES[mode][1];
}
themeBtn.textContent = MODES[mode][1];
themeBtn.addEventListener('click', () => { mode = (mode + 1) % MODES.length; applyMode(); });

const start = location.hash.slice(1);
show(TABS.some(t => t.id === start) ? start : 'flexgrid', false);
})();
</script>
